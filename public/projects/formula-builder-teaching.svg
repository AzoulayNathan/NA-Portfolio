<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Formula Builder teaching">
  <defs>
    <linearGradient id="fbt-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6F3ED"/>
      <stop offset="50%" stop-color="#E8DFC9"/>
      <stop offset="100%" stop-color="#c8ddd6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#fbt-bg)"/>
  <rect x="80" y="80" width="1040" height="640" rx="16" fill="#fff" fill-opacity="0.5" stroke="#3F5A4F" stroke-opacity="0.18"/>

  <text x="120" y="168" font-family="Georgia, serif" font-size="56" fill="#1A1A18">Formula Builder</text>
  <text x="120" y="218" font-family="Inter, system-ui, sans-serif" font-size="20" fill="#3F5A4F" fill-opacity="0.75">NA Classroom · pedagogical formulas</text>

  <rect x="120" y="260" width="140" height="44" rx="6" fill="#3F5A4F" fill-opacity="0.12"/>
  <text x="140" y="290" font-family="Inter, sans-serif" font-size="16" fill="#3F5A4F">Understand</text>
  <rect x="280" y="260" width="110" height="44" rx="6" fill="#3F5A4F" fill-opacity="0.12"/>
  <text x="300" y="290" font-family="Inter, sans-serif" font-size="16" fill="#3F5A4F">Build</text>
  <rect x="410" y="260" width="90" height="44" rx="6" fill="#B5523B" fill-opacity="0.2"/>
  <text x="430" y="290" font-family="Inter, sans-serif" font-size="16" fill="#B5523B">Live</text>
