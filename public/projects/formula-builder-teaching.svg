      <rect x="28" y="12" width="16" height="44" rx="3" fill="#3F5A4F" fill-opacity="0.45"/>
      <rect x="56" y="6" width="16" height="50" rx="3" fill="#3F5A4F" fill-opacity="0.4"/>
      <rect x="84" y="20" width="16" height="36" rx="3" fill="#B5523B" fill-opacity="0.55"/>
      <rect x="112" y="2" width="16" height="54" rx="3" fill="#3F5A4F" fill-opacity="0.35"/>
