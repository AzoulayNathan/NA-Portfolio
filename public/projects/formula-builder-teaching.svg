    <text x="28" y="100" font-family="ui-monospace, monospace" font-size="36" fill="#1A1A18">&#956; = 4.2</text>
    <text x="28" y="150" font-family="Inter, sans-serif" font-size="14" fill="#3F5A4F" fill-opacity="0.7">26 formulas · 8 themes</text>
    <g transform="translate(28, 180)">
