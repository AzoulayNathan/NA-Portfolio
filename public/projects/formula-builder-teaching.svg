  <text x="540" y="290" font-family="Inter, sans-serif" font-size="16" fill="#3F5A4F">Practice</text>

  <text x="140" y="400" font-family="ui-monospace, monospace" font-size="42" fill="#3F5A4F">v = d / t</text>
