<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-label="Formula Builder">
  <defs>
    <linearGradient id="fb-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6F3ED"/>
      <stop offset="42%" stop-color="#E8DFC9"/>
      <stop offset="100%" stop-color="#d5e5e0"/>
    </linearGradient>
    <linearGradient id="fb-panel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.38"/>
    </linearGradient>
    <filter id="fb-soft" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#3F5A4F" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="900" height="520" fill="url(#fb-bg)"/>
  <circle cx="780" cy="90" r="120" fill="#AFC8D1" fill-opacity="0.35"/>
  <circle cx="120" cy="440" r="90" fill="#3F5A4F" fill-opacity="0.06"/>

  <g filter="url(#fb-soft)">
    <rect x="56" y="56" width="788" height="408" rx="14" fill="url(#fb-panel)" stroke="#3F5A4F" stroke-opacity="0.22"/>
  </g>

  <text x="88" y="118" font-family="Georgia, 'Cormorant Garamond', serif" font-size="44" font-weight="500" fill="#1A1A18">Formula Builder</text>
  <text x="88" y="156" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#3F5A4F" fill-opacity="0.8">Theme ? understand ? build ? live ? practice</text>

  <g font-family="Inter, system-ui, sans-serif" font-size="11" fill="#3F5A4F">
    <rect x="88" y="178" width="72" height="26" rx="4" fill="#3F5A4F" fill-opacity="0.1"/>
    <text x="98" y="195">Theme</text>
    <rect x="168" y="178" width="88" height="26" rx="4" fill="#3F5A4F" fill-opacity="0.1"/>
    <text x="178" y="195">Understand</text>
    <rect x="264" y="178" width="64" height="26" rx="4" fill="#3F5A4F" fill-opacity="0.1"/>
    <text x="274" y="195">Build</text>
    <rect x="336" y="178" width="48" height="26" rx="4" fill="#B5523B" fill-opacity="0.15"/>
    <text x="346" y="195" fill="#B5523B">Live</text>
    <rect x="392" y="178" width="72" height="26" rx="4" fill="#3F5A4F" fill-opacity="0.1"/>
    <text x="402" y="195">Practice</text>
  </g>

  <g font-family="ui-monospace, 'SF Mono', monospace">
    <text x="108" y="268" font-size="34" fill="#3F5A4F">v = d / t</text>
    <text x="108" y="318" font-size="26" fill="#5a7a6a">x&#772; = &#931;x / n</text>
    <text x="108" y="362" font-size="26" fill="#5a7a6a">A = &#960;r&#178;</text>
  </g>

  <g transform="translate(108, 388)">
    <rect x="0" y="0" width="12" height="28" rx="2" fill="#3F5A4F" fill-opacity="0.35"/>
    <rect x="18" y="8" width="12" height="20" rx="2" fill="#3F5A4F" fill-opacity="0.5"/>
    <rect x="36" y="4" width="12" height="24" rx="2" fill="#3F5A4F" fill-opacity="0.45"/>
    <rect x="54" y="12" width="12" height="16" rx="2" fill="#B5523B" fill-opacity="0.55"/>
    <rect x="72" y="2" width="12" height="26" rx="2" fill="#3F5A4F" fill-opacity="0.4"/>
    <text x="0" y="48" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#3F5A4F" fill-opacity="0.55">variation insight</text>
  </g>

  <rect x="500" y="228" width="320" height="168" rx="10" fill="#3F5A4F" fill-opacity="0.07" stroke="#3F5A4F" stroke-opacity="0.15"/>
  <text x="524" y="262" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#3F5A4F" font-weight="600">Live builder</text>
  <text x="524" y="298" font-family="ui-monospace, monospace" font-size="24" fill="#1F3D33">v = 12 m/s</text>
  <text x="524" y="328" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A18" fill-opacity="0.65">d = 60 m · t = 5 s</text>
  <text x="524" y="358" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#3F5A4F" fill-opacity="0.7">26 formulas · 8 themes · EN / FR / ES</text>
  <rect x="524" y="372" width="88" height="6" rx="3" fill="#3F5A4F" fill-opacity="0.25"/>
  <rect x="524" y="372" width="58" height="6" rx="3" fill="#B5523B" fill-opacity="0.5"/>
</svg>
